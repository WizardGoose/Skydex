<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#07080a" />
    <meta name="color-scheme" content="dark" />

    <!-- Deliberately not the site name. index.html carries the only two hand
         written copies of SITE_NAME ("MANUAL RENAME SPOT 1 of 2" and "2 of 2");
         a third copy here would put that count out of date the next time the
         site is renamed, and this page is on screen for one redirect. -->
    <title>Redirecting</title>

    <!-- Same obsidian ground index.html paints, so the hop through this page is
         not a white flash between two dark screens. -->
    <style>
      html {
        background-color: #07080a;
      }
    </style>
  </head>
  <body>
    <script>
      /*
       * The write half of the GitHub Pages deep-link workaround. Pages is a
       * static host with no rewrite rule, so a visitor who opens
       * /greenhouse directly asks for a file that does not
       * exist and gets this page instead - with the address they asked for
       * still in the address bar. That address is the only copy of their
       * intent, so it is stashed and then restored once the real app is up.
       *
       * The read half is src/staticRouteRestore.ts, and the two only
       * work as a pair. The contract between them, exactly:
       *
       *   key    sessionStorage["pathToRedirect"]
       *   value  window.location.pathname + search + hash, verbatim
       *
       * Verbatim matters in both directions. The value is not encoded, not
       * trimmed, decoded, or re-encoded before the startup handoff passes it to
       * history.replaceState. The fragment is part of the payload contract.
       */
      (function () {
        var requested = window.location.pathname + window.location.search + window.location.hash;

        var entry = "/";

        // Nothing to hand over when the entry is what was asked for. Pages
        // will not serve this file for that address anyway, since index.html
        // matches it; the guard is here so a stale key cannot be written on
        // the one path the reader deliberately ignores.
        if (requested !== entry) {
          try {
            sessionStorage.setItem("pathToRedirect", requested);
          } catch (e) {
            // Private modes and blocked storage both throw. Losing the deep
            // link is a worse landing than losing the visitor, so the
            // redirect still happens and they arrive at the home page.
          }
        }

        // replace, not assign: the 404 must not sit in history, or Back from
        // the restored page lands here and bounces forward again.
        window.location.replace(entry);
      })();
    </script>
    <noscript>
      <div style="text-align: center; padding: 2rem; font-family: system-ui, sans-serif; color: #d8d2e2">
        <p>This page needs JavaScript to restore the address you asked for.</p>
        <p>Open the site root and navigate from there.</p>
      </div>
    </noscript>
  </body>
</html>
