<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SKYDEX_PAGE_METADATA_START -->
    <!-- MANUAL RENAME SPOT 1 of 2. Static HTML cannot import, so this literal is
         a copy of SITE_NAME in src/ui/brand.ts, which is the source of truth. -->
    <title>Skydex</title>
    <meta name="description" content="All in one Hypixel SkyBlock utility." />
    <link rel="canonical" href="https://skydex.ca/" />
    <meta property="og:site_name" content="Skydex" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Skydex" />
    <meta property="og:description" content="All in one Hypixel SkyBlock utility." />
    <meta property="og:url" content="https://skydex.ca/" />
    <meta property="og:image" content="https://skydex.ca/favicon/favicon.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="128" />
    <meta property="og:image:height" content="128" />
    <meta property="og:image:alt" content="Skydex icon" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Skydex" />
    <meta name="twitter:description" content="All in one Hypixel SkyBlock utility." />
    <meta name="twitter:image" content="https://skydex.ca/favicon/favicon.png" />
    <!-- SKYDEX_PAGE_METADATA_END -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark" />

    <!-- First paint reads the same semantic theme tokens as the mounted app.
         The backdrop is preloaded at default priority so it never queues
         ahead of the JavaScript that paints the page. -->
    <link rel="stylesheet" href="/theme.css?v=__SKYDEX_DEPLOY_REVISION__" />
    <link rel="preload" as="image" href="/bg/hub.jpg" />

    <link rel="icon" type="image/x-icon" href="/favicon/skydex-glasses.ico?v=1" sizes="16x16 24x24 32x32 48x48 64x64 128x128 256x256" />
    <link rel="icon" type="image/png" href="/favicon/skydex-glasses-16.png?v=1" sizes="16x16" />
    <link rel="icon" type="image/png" href="/favicon/skydex-glasses-24.png?v=1" sizes="24x24" />
    <link rel="icon" type="image/png" href="/favicon/skydex-glasses-32.png?v=1" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon/skydex-glasses-48.png?v=1" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon/skydex-glasses-64.png?v=1" sizes="64x64" />
    <link rel="apple-touch-icon" href="/favicon/favicon.png" />

    <!-- No font preconnects. Every typeface the site uses is served from
         /fonts on this origin, declared in src/index.css, so there is no
         third-party socket to open early. -->

  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="text-align: center; padding: 2rem; font-family: system-ui, sans-serif; color: #d8d2e2">

             src/ui/brand.ts, which is the source of truth. -->

      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
