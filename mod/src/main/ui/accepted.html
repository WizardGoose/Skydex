  #skydex-current-greenhouse-mod {
    --skydex-ink: #07080a;
    --skydex-panel: rgba(10, 13, 18, 0.975);
    --skydex-panel-deep: #06090d;
    --skydex-panel-soft: #10151b;
    --skydex-line: rgba(211, 219, 229, 0.14);
    --skydex-line-soft: rgba(211, 219, 229, 0.085);
    --skydex-text: #e8edf3;
    --skydex-text-soft: #b2bfce;
    --skydex-muted: #8797ad;
    --skydex-dim: #586578;
    --skydex-cyan: #38bdf2;
    --skydex-cyan-soft: #a5e2ff;
    --skydex-green: #43d17a;
    --skydex-amber: #f4b63f;
    --skydex-red: #ff5d68;
    --skydex-farmland: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAMAAACdt4HsAAAAElBMVEVVLg8/IQo0GQduPBVVVVVvb2/8ZIZdAAAAy0lEQVR4nN2XSRKFQAhD/6D3v7KNZaxIB3VLsnEAX1dhhPYDfYd+Q3EMnQERj+v/IQcAUyIByUhSEFy7APiEi8RJiDPgAm8OQIIyUnYbYqGLkQwACC5DdxD1QTkAIAQqM+UiTx2pMYCNpJrKOpQ/pOktGABQrKppMpwf3s9NAE9NFeYph2tzgBosb5uJC4ATOAn3VVzuUBoDoBgqKBA3zdeDpTHgySiq4cRi58omgKqhZDPJHxIDgCpkflgtIHfrzQFqeFRGm3ZovQEbZBwU4clwe9sAAAAASUVORK5CYII=");
    width: 100%;
    height: 100vh;
    min-height: 560px;
    overflow: hidden;
    background: transparent;
    color: var(--skydex-text);
    font-family: "Skydex Montserrat", system-ui, sans-serif;
  }

  #skydex-current-greenhouse-mod,
  #skydex-current-greenhouse-mod * {
    box-sizing: border-box;
  }

  #skydex-current-greenhouse-mod button,
  #skydex-current-greenhouse-mod input {
    font: inherit;
  }

  #skydex-current-greenhouse-mod .sdm-stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    isolation: isolate;
    background: #17202a;
  }

  #skydex-current-greenhouse-mod .sdm-world,
  #skydex-current-greenhouse-mod .sdm-shade {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #skydex-current-greenhouse-mod .sdm-world {
    object-fit: cover;
    filter: blur(2px) saturate(0.72) brightness(0.72);
    transform: scale(1.012);
  }

  #skydex-current-greenhouse-mod .sdm-shade {
    background: rgba(5, 8, 12, 0.46);
  }

  #skydex-current-greenhouse-mod .sdm-shell {
    position: absolute;
    z-index: 2;
    top: 50%;
    left: 50%;
    width: min(760px, calc(100% - 34px));
    height: 380px;
    transform: translate(-50%, -50%);
  }

  #skydex-current-greenhouse-mod .sdm-core {
    position: relative;
    z-index: 3;
    width: 100%;
    height: 100%;
    overflow: visible;
    border: 1px solid rgba(211, 219, 229, 0.18);
    border-radius: 6px;
    background: var(--skydex-panel);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
  }

  #skydex-current-greenhouse-mod .sdm-shell.is-loadouts-open .sdm-core {
    border-radius: 6px 0 0 6px;
  }

  #skydex-current-greenhouse-mod .sdm-topbar {
    position: relative;
    z-index: 5;
    height: 48px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--skydex-line);
    padding: 0 12px 0 17px;
    background: rgba(3, 5, 8, 0.72);
  }

  #skydex-current-greenhouse-mod .sdm-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #skydex-current-greenhouse-mod .sdm-wordmark {
    display: block;
    width: 132px;
    height: auto;
    image-rendering: auto;
  }

  #skydex-current-greenhouse-mod .sdm-brand-rule {
    width: 1px;
    height: 17px;
    background: rgba(232, 237, 243, 0.22);
  }

  #skydex-current-greenhouse-mod .sdm-version {
    color: var(--skydex-muted);
    font-family: "Skydex Space", sans-serif;
    font-size: 12px;
    font-weight: 500;
  }

  #skydex-current-greenhouse-mod .sdm-top-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 11px;
  }

  #skydex-current-greenhouse-mod .sdm-connection {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--skydex-muted);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.06em;
  }

  #skydex-current-greenhouse-mod .sdm-connection-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--skydex-cyan);
    box-shadow: 0 0 9px rgba(56, 189, 242, 0.58);
  }

  #skydex-current-greenhouse-mod .sdm-loadout-toggle {
    width: 30px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 0;
    padding: 0;
    background: transparent;
    color: rgba(56, 189, 242, 0.78);
    cursor: pointer;
  }

  #skydex-current-greenhouse-mod .sdm-loadout-toggle:hover {
    color: var(--skydex-cyan-soft);
  }

  #skydex-current-greenhouse-mod .sdm-loadout-toggle .sdm-chevron {
    display: block;
    width: 14px;
    height: 26px;
    flex: 0 0 14px;
    object-fit: contain;
    object-position: center;
    image-rendering: auto;
    transform-origin: 50% 50%;
    transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  #skydex-current-greenhouse-mod .sdm-shell.is-loadouts-open .sdm-loadout-toggle .sdm-chevron {
    transform: rotate(180deg);
  }

  #skydex-current-greenhouse-mod .sdm-main {
    height: calc(100% - 48px);
    padding: 12px 14px 13px;
  }

  #skydex-current-greenhouse-mod .sdm-share-field {
    position: relative;
    display: block;
    width: 100%;
    height: 36px;
    border: 1px solid var(--skydex-line);
    border-radius: 4px;
    background: rgba(2, 5, 8, 0.62);
  }

  #skydex-current-greenhouse-mod .sdm-share-field:focus-within,
  #skydex-current-greenhouse-mod .sdm-share-field.is-imported {
    border-color: rgba(56, 189, 242, 0.72);
    box-shadow: inset 2px 0 var(--skydex-cyan);
  }

  #skydex-current-greenhouse-mod .sdm-share-field input {
    width: 100%;
    height: 100%;
    border: 0;
    outline: 0;
    padding: 0 11px;
    background: transparent;
    color: #cbd6e0;
    font-size: 12px;
    font-weight: 400;
  }

  #skydex-current-greenhouse-mod .sdm-share-field input::placeholder {
    color: #68778b;
  }

  #skydex-current-greenhouse-mod .sdm-workspace {
    height: 267px;
    display: grid;
    grid-template-columns: 246px minmax(0, 1fr);
    gap: 14px;
    margin-top: 9px;
  }

  #skydex-current-greenhouse-mod .sdm-plot-column {
    min-width: 0;
    display: grid;
    grid-template-rows: 27px 222px 18px;
  }

  #skydex-current-greenhouse-mod .sdm-plot-heading {
    min-width: 0;
    display: flex;
    align-items: start;
    justify-content: space-between;
    gap: 8px;
  }

  #skydex-current-greenhouse-mod .sdm-eyebrow {
    display: block;
    color: #91a4b9;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.11em;
    line-height: 1;
    text-transform: uppercase;
  }

  #skydex-current-greenhouse-mod .sdm-plot-name {
    min-width: 0;
    margin-top: 3px;
    color: var(--skydex-text);
    font-size: 14px;
    font-weight: 500;
    line-height: 1.3;
    white-space: normal;
  }

  #skydex-current-greenhouse-mod .sdm-progress {
    flex: 0 0 auto;
    padding-top: 12px;
    color: var(--skydex-muted);
    font-size: 11px;
    font-weight: 400;
  }

  #skydex-current-greenhouse-mod .sdm-board {
    width: 222px;
    height: 222px;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
    gap: 2px;
    padding: 4px;
    border: 1px solid var(--skydex-line);
    background: #05080c;
  }

  #skydex-current-greenhouse-mod .sdm-cell {
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    border: 1px solid rgba(147, 163, 184, 0.12);
    background: #121820;
  }

  #skydex-current-greenhouse-mod .sdm-cell.is-planned {
    background-color: #2e1a0e;
    background-image: linear-gradient(rgba(3, 6, 9, 0.18), rgba(3, 6, 9, 0.18)), var(--skydex-farmland);
    background-position: center;
    background-size: cover;
  }

  #skydex-current-greenhouse-mod .sdm-cell.is-correct {
    border-color: var(--skydex-green);
    box-shadow: inset 0 0 0 1px rgba(67, 209, 122, 0.24);
  }

  #skydex-current-greenhouse-mod .sdm-cell.is-next {
    border-color: var(--skydex-cyan);
    box-shadow: inset 0 0 0 1px rgba(56, 189, 242, 0.22);
  }

  #skydex-current-greenhouse-mod .sdm-cell.is-mutation {
    border-color: var(--skydex-amber);
    box-shadow: inset 0 0 0 1px rgba(244, 182, 63, 0.22);
  }

  #skydex-current-greenhouse-mod .sdm-cell.is-replace {
    border-color: var(--skydex-red);
    box-shadow: inset 0 0 0 1px rgba(255, 93, 104, 0.24);
  }

  #skydex-current-greenhouse-mod .sdm-cell img {
    position: absolute;
    inset: 1px;
    width: calc(100% - 2px);
    height: calc(100% - 2px);
    object-fit: contain;
    image-rendering: pixelated;
  }

  #skydex-current-greenhouse-mod .sdm-cell.is-next img,
  #skydex-current-greenhouse-mod .sdm-cell.is-mutation img {
    opacity: 0.58;
  }

  #skydex-current-greenhouse-mod .sdm-legend {
    display: flex;
    align-items: end;
    gap: 10px;
    color: var(--skydex-muted);
    font-size: 10px;
    white-space: nowrap;
  }

  #skydex-current-greenhouse-mod .sdm-legend span {
    display: inline-flex;
    align-items: center;

    const cropPath = (crop) => cropImages[crop];

    const layouts = [
      {
        id: "waterworks",
        name: "Wizard's Waterworks",
        goal: "Grow 2 Soggybud",
        cells: 12,
        progress: "6 / 12",
        targets: [{ crop: "soggybud", name: "Soggybud", qty: 2 }],
        inputs: [
          { crop: "melon", name: "Melon", qty: 4 },
          { crop: "gloomgourd", name: "Gloomgourd", qty: 2 }
        ],
        placements: [
          [24, "wheat", "correct"], [25, "wheat", "correct"],
          [34, "dustgrain", "next"], [35, "dustgrain", "next"],
          [44, "melon", "mutation"], [45, "gloomgourd", "mutation"],
          [46, "melon", "next"], [54, "pumpkin", "replace"],
          [55, "gloomgourd", "mutation"], [56, "melon", "next"],
          [64, "soggybud", "mutation"], [65, "soggybud", "correct"]
        ],
        replacement: ["pumpkin", "Pumpkin", "wheat", "Wheat"]
      },
      {
        id: "gloom",
        name: "Gloom Grove",
        goal: "Grow 2 Gloomgourd",
        cells: 8,
        progress: "4 / 8",
        targets: [{ crop: "gloomgourd", name: "Gloomgourd", qty: 2 }],
        inputs: [
          { crop: "pumpkin", name: "Pumpkin", qty: 2 },
          { crop: "melon", name: "Melon", qty: 2 }
        ],
        placements: [
          [33, "pumpkin", "correct"], [34, "melon", "correct"],
          [43, "gloomgourd", "mutation"], [44, "gloomgourd", "mutation"],
          [53, "pumpkin", "next"], [54, "melon", "next"],
          [63, "gloomgourd", "mutation"], [64, "gloomgourd", "mutation"]
        ]
      },
      {
        id: "soggy",
        name: "Soggy Field",
        goal: "Grow 3 Dustgrain",
        cells: 9,
        progress: "5 / 9",
        targets: [{ crop: "dustgrain", name: "Dustgrain", qty: 3 }],
        inputs: [{ crop: "wheat", name: "Wheat", qty: 6 }],
        placements: [
          [22, "wheat", "correct"], [23, "wheat", "correct"], [24, "wheat", "correct"],
          [32, "dustgrain", "mutation"], [33, "dustgrain", "mutation"], [34, "dustgrain", "mutation"],
          [42, "wheat", "next"], [43, "wheat", "next"], [44, "wheat", "next"]
        ]
      }
    ];

    let activeLayout = layouts[0];
    const boardCells = [];

    for (let index = 0; index < 100; index += 1) {
      const cell = document.createElement("span");
      cell.className = "sdm-cell";
      board.appendChild(cell);
      boardCells.push(cell);
    }

    const itemMarkup = (item) => `
      <span class="sdm-item">
        <img src="${cropPath(item.crop)}" alt="" />
        <span><strong>${item.name}</strong><small>×${item.qty}</small></span>
      </span>`;

    function drawBoard(layout) {
      boardCells.forEach((cell) => {
        cell.className = "sdm-cell";
        cell.replaceChildren();
      });

      layout.placements.forEach(([index, crop, state]) => {
        const cell = boardCells[index];
        cell.className = `sdm-cell is-planned is-${state}`;
        const image = document.createElement("img");
        image.src = cropPath(crop);
        image.alt = "";
        cell.appendChild(image);
      });

      board.setAttribute("aria-label", `${layout.name}, ${layout.cells} occupied cells on a 10 by 10 greenhouse plot`);
    }

    function drawReplacement(layout) {
      const row = root.querySelector("[data-replacement]");
      if (!layout.replacement) {
        row.hidden = true;
        return;
      }
      row.hidden = false;
      const [fromCrop, fromName, toCrop, toName] = layout.replacement;
      row.innerHTML = `
        <b>Replace</b>
        <img src="${cropPath(fromCrop)}" alt="" />
        <strong>${fromName}</strong>
        <span>→</span>
        <img src="${cropPath(toCrop)}" alt="" />
        <strong>${toName}</strong>`;
    }

    function renderLayout(layout) {
      activeLayout = layout;
      root.querySelector(".sdm-plot-name").textContent = layout.name;
      root.querySelector(".sdm-progress").textContent = layout.progress;
      root.querySelector("[data-current-goal]").textContent = layout.goal;
      root.querySelector("[data-cell-count]").textContent = `${layout.cells} cells`;
      root.querySelector("[data-target-count]").textContent = layout.targets.reduce((total, item) => total + item.qty, 0);
      root.querySelector("[data-input-count]").textContent = layout.inputs.reduce((total, item) => total + item.qty, 0);
      root.querySelector("[data-targets]").innerHTML = layout.targets.map(itemMarkup).join("");
      root.querySelector("[data-inputs]").innerHTML = layout.inputs.map(itemMarkup).join("");
      drawBoard(layout);
      drawReplacement(layout);
      root.querySelectorAll(".sdm-loadout-row").forEach((row) => {
        row.classList.toggle("is-active", row.dataset.layoutId === layout.id);
      });
      live.textContent = `${layout.name} loaded`;
    }

    function miniBoard(layout) {
      const placements = new Map(layout.placements.map(([index, crop]) => [index, crop]));
      let cells = "";
      for (let index = 0; index < 36; index += 1) {
        const sourceIndex = Math.min(99, Math.floor(index / 6) * 10 + Math.floor((index % 6) * 1.5) + 11);
        const crop = placements.get(sourceIndex);
        cells += `<i${crop ? ' class="is-planted"' : ""}>${crop ? `<img src="${cropPath(crop)}" alt="" />` : ""}</i>`;
      }
      return `<span class="sdm-mini-board" aria-hidden="true">${cells}</span>`;
    }

    const loadoutList = root.querySelector("[data-loadout-list]");
    layouts.forEach((layout) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "sdm-loadout-row";
      button.dataset.layoutId = layout.id;
      button.innerHTML = `${miniBoard(layout)}<span class="sdm-loadout-copy"><strong>${layout.name}</strong><small>${layout.goal.replace("Grow ", "")}</small></span>`;
      button.addEventListener("click", () => renderLayout(layout));
      loadoutList.appendChild(button);
    });

    function setDrawer(open) {
      shell.classList.toggle("is-loadouts-open", open);
      toggle.setAttribute("aria-expanded", String(open));
      toggle.setAttribute("aria-label", open ? "Close loadouts" : "Open loadouts");
      drawer.setAttribute("aria-hidden", String(!open));
    }

    function setDataMenu(open) {
      dataMenu.hidden = !open;
      dataToggle.setAttribute("aria-expanded", String(open));
    }

    toggle.addEventListener("click", () => setDrawer(toggle.getAttribute("aria-expanded") !== "true"));
    dataToggle.addEventListener("click", () => setDataMenu(dataToggle.getAttribute("aria-expanded") !== "true"));

    dataMenu.querySelectorAll("input").forEach((input) => {
      input.addEventListener("change", () => {
        dataCount.textContent = dataMenu.querySelectorAll("input:checked").length;
      });
    });

    root.querySelector(".sdm-export-button").addEventListener("click", (event) => {
      const button = event.currentTarget;
      button.textContent = "Copied";
      live.textContent = "Export code copied";
      setTimeout(() => { button.textContent = "Copy export code"; }, 900);
    });

    shareInput.addEventListener("input", () => {
      shareField.classList.toggle("is-imported", shareInput.value.trim().length > 0);
    });

    root.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      setDrawer(false);
      setDataMenu(false);
    });

    renderLayout(activeLayout);
    setDrawer(false);
    setDataMenu(false);

    if (globalThis.Tweak) {
      const previewState = { loadoutsOpen: false };
      const tweak = new globalThis.Tweak({
        container: root,
        onChange: () => setDrawer(previewState.loadoutsOpen)
      });
      tweak.addToggle(previewState, "loadoutsOpen", { label: "Loadouts open", reference: "mod.loadouts" });
    }
  })();
</script>
