plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// No `mappings` line on purpose: Minecraft >= 26.1 ships unobfuscated, so
	// Loom needs no mapping artifact and mod deps use plain `implementation`
	// rather than `modImplementation`.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// The serialisation, codec, storage and lore-parsing layers deliberately
	// avoid Minecraft types, so they test on a plain JVM. Gson comes from
	// Minecraft at runtime; it is declared here only for the test classpath.
	testImplementation 'com.google.code.gson:gson:2.11.0'
	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Real-client GUI captures live in their own mod/source set. They use Minecraft's
// renderer, fonts, textures and input path, but none of the test classes or
// approved screenshots are packaged in the release jar.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'skydex-gui-test'
		enableGameTests = false
		eula = true
	}
}

loom {
	runs {
		clientGameTest {
			if (project.hasProperty('testDataMigration')) vmArg '-Dskydex.test.migration=true'
			if (project.hasProperty('plantCaptureDir')) vmArg "-Dskydex.test.captures=${project.property('plantCaptureDir')}"
			vmArg "-Dskydex.visual.output=${layout.buildDirectory.dir('gui-visual/actual').get().asFile.absolutePath}"
		}
	}
}

java {
	// Both supported Minecraft targets are compiled for and require Java 25.
	toolchain.languageVersion = JavaLanguageVersion.of(25)
	withSourcesJar()
}

// HTML is retained as design-reference source only; no browser assets ship.
sourceSets.main.resources.exclude('assets/skydex/ui/**')

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
	def version = project.version
	def minecraftVersion = project.minecraft_version
	def fabricApiVersion = project.fabric_api_version
	inputs.property 'version', version
	inputs.property 'minecraft_version', minecraftVersion
	inputs.property 'fabric_api_version', fabricApiVersion

	filesMatching('fabric.mod.json') {
		expand 'version': version, 'minecraft_version': minecraftVersion, 'fabric_api_version': fabricApiVersion
	}
}

test {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}

def guiVisualStates = [
	'empty',
	'loaded',
	'long_share_link',
	'presets_open',
	'presets_after_outside_click',
	'included_data_open'
]

tasks.register('guiVisualPreview') {
	group = 'verification'
	description = 'Captures the real Skydex GUI for Wizard review.'
	dependsOn tasks.named('runClientGameTest')
}

tasks.register('verifyGuiBaselines') {
	group = 'verification'
	description = 'Refuses release verification until every GUI state has an approved image.'
	doLast {
		def target = project.minecraft_version.replaceAll('[^A-Za-z0-9]+', '_')
		def templateDir = file('src/gametest/resources/templates')
		def missing = guiVisualStates.findAll { state ->
			!new File(templateDir, "skydex_gui_${target}_${state}.png").isFile()
		}
		if (!missing.isEmpty()) {
			throw new GradleException(
					"GUI release check has no Wizard-approved baseline for: ${missing.join(', ')}")
		}
	}
}

tasks.register('guiVisualCheck') {
	group = 'verification'
	description = 'Compares the real Skydex GUI with Wizard-approved images.'
	dependsOn tasks.named('verifyGuiBaselines')
	dependsOn tasks.named('runClientGameTest')
}

tasks.named('runClientGameTest') {
	mustRunAfter tasks.named('verifyGuiBaselines')
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
	from('THIRD_PARTY_NOTICES.md') {
		rename { "THIRD_PARTY_NOTICES_${project.base.archivesName.get()}.md" }
	}
}
