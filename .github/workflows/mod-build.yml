name: Build Skydex mod

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - "mod/**"
      - ".github/workflows/mod-build.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mod-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build (Minecraft ${{ matrix.minecraft }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "26.1.2"
            fabric_api: "0.155.2+26.1.2"
          - minecraft: "26.2"
            fabric_api: "0.158.0+26.2"

    defaults:
      run:
        working-directory: mod

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Read and verify release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          test -n "$version"
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Release tag $RELEASE_TAG does not match mod version $version" >&2
            exit 1
          fi
          echo "mod=$version" >> "$GITHUB_OUTPUT"

      - name: Test and build mod
        run: >-
          ./gradlew build --no-daemon
          -Pminecraft_version=${{ matrix.minecraft }}
          -Pfabric_api_version=${{ matrix.fabric_api }}

      - name: Upload Minecraft ${{ matrix.minecraft }} JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skydex-mod-minecraft-${{ matrix.minecraft }}-${{ github.sha }}
          path: mod/build/libs/skydex-${{ steps.version.outputs.mod }}+${{ matrix.minecraft }}.jar
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Attach verified JARs to Release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified mod JARs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: skydex-mod-minecraft-*
          merge-multiple: true
          path: release-assets

      - name: Create checksums
        run: |
          cd release-assets
          sha256sum *.jar > SHA256SUMS.txt

      - name: Attach JARs to published Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/*.jar release-assets/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
